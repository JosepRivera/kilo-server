name: kilo-server

services:
  database:
    image: postgres:18
    environment: [POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB]
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      API_HOST_PORT: ${API_HOST_PORT:-3001}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: sync+restart
          path: ./drizzle
          target: /app/drizzle
        - action: rebuild
          path: package.json

  docs:
    build: ./docs
    env_file:
      - path: ./docs/.env
        required: false
    ports:
      - "127.0.0.1:${DOCS_HOST_PORT:-4321}:4321"
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./docs/src
          target: /app/src
        - action: sync
          path: ./docs/public
          target: /app/public
        - action: sync+restart
          path: ./docs/astro.config.mjs
          target: /app/astro.config.mjs
        - action: rebuild
          path: ./docs/package.json

networks:
  default:
    name: kilo-server-network

volumes:
  postgres_data:
    name: kilo-server-postgres-data
